
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagode Transfert - Voyagez en toute sérénité</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: 'rgb(var(--brand-accent-rgb) / <alpha-value>)',
                dark: 'rgb(var(--brand-dark-rgb) / <alpha-value>)',
                light: '#FAFAF8',
                black: '#000000',
              },
              gold: {
                DEFAULT: 'rgb(var(--accent-gold-rgb) / <alpha-value>)',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs de marque par défaut — écrasées à l'exécution par les réglages du site */
            --brand-dark: #6F1AAE;
            --brand-dark-rgb: 111 26 174;
            --brand-accent: #8A2BE2;
            --brand-accent-rgb: 138 43 226;
            --brand-dark-hover: #5A148C;
            /* Accent chaud fixe (billets, prix, horaires) — indépendant de la couleur de marque */
            --accent-gold: #E0982F;
            --accent-gold-rgb: 224 152 47;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAF8;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes chat-pop-in {
            from { opacity: 0; transform: scale(0.4); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes chat-panel-in {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes chat-bubble-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes chat-typing-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-4px); opacity: 1; }
        }
        @keyframes chat-ping-soft {
            0% { transform: scale(0.9); opacity: 0.7; }
            70%, 100% { transform: scale(1.8); opacity: 0; }
        }
        .animate-chat-pop-in { animation: chat-pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        .animate-chat-panel-in { animation: chat-panel-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-chat-bubble-in { animation: chat-bubble-in 0.25s ease-out both; }
        .animate-chat-ping-soft { animation: chat-ping-soft 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .chat-typing-dot { animation: chat-typing-bounce 1.2s ease-in-out infinite; }
        .chat-typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .chat-typing-dot:nth-child(3) { animation-delay: 0.3s; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-light text-brand-black">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
